<script>

/* =========================================================
   API
========================================================= */

const API =
    "https://biquote.io/api";


let currentPrice = null;
let mainSignal = "NO TRADE";


/* =========================================================
   HELPERS
========================================================= */

function number(value){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toFixed(2);
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function dateTime(value){

    const date =
        new Date(value);

    if(isNaN(date.getTime())){
        return "Няма зададен час";
    }

    return new Intl.DateTimeFormat(
        "bg-BG",
        {
            timeZone:"Europe/Sofia",
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(date);
}


function countdown(value){

    const target =
        new Date(value).getTime();

    const diff =
        target - Date.now();

    if(diff <= 0){
        return "започва сега";
    }

    const minutes =
        Math.floor(diff / 60000);

    const days =
        Math.floor(minutes / 1440);

    const hours =
        Math.floor(
            (minutes % 1440) / 60
        );

    const mins =
        minutes % 60;


    if(days > 0){
        return `след ${days}д ${hours}ч`;
    }

    if(hours > 0){
        return `след ${hours}ч ${mins}м`;
    }

    return `след ${mins}м`;
}


/* =========================================================
   PRICE
========================================================= */

async function loadPrice(){

    try{

        const response =
            await fetch(
                API +
                "/XAUUSD?allowStale=true",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){
            throw new Error(
                "Price error"
            );
        }


        const data =
            await response.json();


        currentPrice =
            Number(
                data.mid ??
                data.price ??
                data.last ??
                data.close ??
                data.bid
            );


        if(!Number.isFinite(currentPrice)){
            throw new Error(
                "Invalid price"
            );
        }


        document.getElementById(
            "price"
        ).textContent =
            number(currentPrice);


        document.getElementById(
            "priceInfo"
        ).textContent =
            "Последна налична цена";


        document.getElementById(
            "statusText"
        ).textContent =
            "Онлайн";


        document.getElementById(
            "statusDot"
        ).style.background =
            "#31d158";


        calculateTradePlan();

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "statusText"
        ).textContent =
            "Няма връзка";

        document.getElementById(
            "statusDot"
        ).style.background =
            "#ff453a";
    }

}


/* =========================================================
   OHLC
========================================================= */

async function loadOHLC(interval){

    const response =
        await fetch(
            API +
            `/XAUUSD/ohlc?interval=${interval}&limit=150`,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){
        throw new Error(
            "OHLC error"
        );
    }


    const data =
        await response.json();


    if(Array.isArray(data)){
        return data;
    }

    if(Array.isArray(data.data)){
        return data.data;
    }

    if(Array.isArray(data.bars)){
        return data.bars;
    }

    return [];
}


/* =========================================================
   CLOSE
========================================================= */

function closeValue(candle){

    return Number(
        candle.close ??
        candle.c ??
        candle.Close
    );
}


/* =========================================================
   DIRECTION
========================================================= */

function direction(candles){

    const closes =
        candles
            .map(closeValue)
            .filter(
                x => Number.isFinite(x)
            );


    if(closes.length < 20){
        return "NEUTRAL";
    }


    const recent =
        closes.slice(-10);

    const previous =
        closes.slice(-20,-10);


    const recentAverage =
        recent.reduce(
            (a,b) => a+b,
            0
        ) / recent.length;


    const previousAverage =
        previous.reduce(
            (a,b) => a+b,
            0
        ) / previous.length;


    const recentMove =
        recent[recent.length-1]
        -
        recent[0];


    if(
        recentAverage >
        previousAverage
        &&
        recentMove > 0
    ){
        return "UP";
    }


    if(
        recentAverage <
        previousAverage
        &&
        recentMove < 0
    ){
        return "DOWN";
    }


    return "NEUTRAL";
}


/* =========================================================
   DISPLAY TF
========================================================= */

function displayTF(id,value){

    const el =
        document.getElementById(id);


    el.className =
        "tf-value";


    if(value === "UP"){

        el.textContent =
            "ВЪЗХОДЯЩА";

        el.classList.add(
            "up"
        );

    }
    else if(value === "DOWN"){

        el.textContent =
            "НИСХОДЯЩА";

        el.classList.add(
            "down"
        );

    }
    else{

        el.textContent =
            "НЕУТРАЛНА";

        el.classList.add(
            "neutral"
        );
    }

}


/* =========================================================
   ANALYSIS
========================================================= */

async function analyze(){

    try{

        const result =
            await Promise.all([
                loadOHLC("4h"),
                loadOHLC("1h"),
                loadOHLC("15m")
            ]);


        const d4 =
            direction(result[0]);

        const d1 =
            direction(result[1]);

        const d15 =
            direction(result[2]);


        displayTF(
            "tf4h",
            d4
        );

        displayTF(
            "tf1h",
            d1
        );

        displayTF(
            "tf15m",
            d15
        );


        /*
            САМО ЕДИН ОСНОВЕН СИГНАЛ.
        */

        if(
            d4 === "UP" &&
            d1 === "UP" &&
            d15 === "UP"
        ){

            mainSignal =
                "BUY";

        }
        else if(
            d4 === "DOWN" &&
            d1 === "DOWN" &&
            d15 === "DOWN"
        ){

            mainSignal =
                "SELL";

        }
        else{

            mainSignal =
                "NO TRADE";
        }


        const signal =
            document.getElementById(
                "mainSignal"
            );


        signal.className =
            "signal";


        if(mainSignal === "BUY"){

            signal.textContent =
                "BUY";

            signal.classList.add(
                "buy"
            );

            document.getElementById(
                "signalDescription"
            ).textContent =
                "4H → 1H → 15M са в една посока.";

        }
        else if(mainSignal === "SELL"){

            signal.textContent =
                "SELL";

            signal.classList.add(
                "sell"
            );

            document.getElementById(
                "signalDescription"
            ).textContent =
                "4H → 1H → 15M са в една посока.";

        }
        else{

            signal.textContent =
                "NO TRADE";

            signal.classList.add(
                "wait"
            );

            document.getElementById(
                "signalDescription"
            ).textContent =
                "Няма пълно потвърждение между времевите рамки.";
        }


        calculateTradePlan();

    }
    catch(error){

        console.error(
            "Analysis error:",
            error
        );

        mainSignal =
            "NO TRADE";

    }

}


/* =========================================================
   TRADE PLAN
========================================================= */

function calculateTradePlan(){

    if(
        !Number.isFinite(currentPrice)
        ||
        mainSignal === "NO TRADE"
    ){

        document.getElementById(
            "entry"
        ).textContent = "—";

        document.getElementById(
            "sl"
        ).textContent = "—";

        document.getElementById(
            "tp"
        ).textContent = "—";

        return;
    }


    const risk =
        Math.max(
            currentPrice * 0.003,
            8
        );


    let sl;
    let tp;


    if(mainSignal === "BUY"){

        sl =
            currentPrice - risk;

        tp =
            currentPrice + risk * 2;

    }
    else{

        sl =
            currentPrice + risk;

        tp =
            currentPrice - risk * 2;
    }


    document.getElementById(
        "entry"
    ).textContent =
        number(currentPrice);


    document.getElementById(
        "sl"
    ).textContent =
        number(sl);


    document.getElementById(
        "tp"
    ).textContent =
        number(tp);

}


/* =========================================================
   NEWS CATEGORY
========================================================= */

function category(name){

    const n =
        String(name || "")
        .toLowerCase();


    if(
        n.includes("cpi") ||
        n.includes("consumer price") ||
        n.includes("inflation") ||
        n.includes("pce") ||
        n.includes("ppi") ||
        n.includes("producer price")
    ){
        return "inflation";
    }


    if(
        n.includes("fomc") ||
        n.includes("interest rate") ||
        n.includes("fed rate") ||
        n.includes("federal funds") ||
        n.includes("rate decision")
    ){
        return "rates";
    }


    if(
        n.includes("nonfarm") ||
        n.includes("payroll") ||
        n.includes("employment") ||
        n.includes("adp") ||
        n.includes("jolts")
    ){
        return "jobs";
    }


    if(
        n.includes("unemployment") ||
        n.includes("jobless claims") ||
        n.includes("initial claims")
    ){
        return "unemployment";
    }


    if(
        n.includes("gdp") ||
        n.includes("gross domestic")
    ){
        return "gdp";
    }


    if(
        n.includes("retail sales") ||
        n.includes("consumer spending")
    ){
        return "spending";
    }


    if(
        n.includes("pmi") ||
        n.includes("ism") ||
        n.includes("manufacturing") ||
        n.includes("services")
    ){
        return "business";
    }


    return "other";
}


/* =========================================================
   SCENARIOS
========================================================= */

function scenarios(name){

    const type =
        category(name);


    if(type === "inflation"){

        return {
            first:
                "Ако Actual е ПО-ВИСОК от Forecast → по-висока инфлация → възможни по-високи лихвени очаквания → потенциален натиск върху златото.",

            second:
                "Ако Actual е ПО-НИСЪК от Forecast → по-ниска инфлация → възможни по-ниски лихвени очаквания → потенциална подкрепа за златото."
        };
    }


    if(type === "rates"){

        return {
            first:
                "Ако Фед е ПО-СТРОГ от очакваното → по-високи лихвени очаквания → потенциален натиск върху златото.",

            second:
                "Ако Фед е ПО-МЕК от очакваното → по-ниски лихвени очаквания → потенциална подкрепа за златото."
        };
    }


    if(type === "jobs"){

        return {
            first:
                "Ако данните са ПО-СИЛНИ от Forecast → по-силен трудов пазар → възможна подкрепа за USD → потенциален натиск върху златото.",

            second:
                "Ако данните са ПО-СЛАБИ от Forecast → по-слаб трудов пазар → възможни по-ниски лихвени очаквания → потенциална подкрепа за златото."
        };
    }


    if(type === "unemployment"){

        return {
            first:
                "Ако безработицата/claims са ПО-ВИСОКИ → по-слаб трудов пазар → възможна подкрепа за златото.",

            second:
                "Ако са ПО-НИСКИ → по-силен трудов пазар → възможен натиск върху златото."
        };
    }


    if(type === "gdp"){

        return {
            first:
                "Ако GDP е ПО-СИЛЕН от Forecast → по-силна икономика → възможен натиск върху златото.",

            second:
                "Ако GDP е ПО-СЛАБ от Forecast → възможни по-ниски лихвени очаквания → потенциална подкрепа за златото."
        };
    }


    if(type === "spending"){

        return {
            first:
                "Ако потреблението е ПО-СИЛНО → по-устойчива икономика → възможен натиск върху златото.",

            second:
                "Ако потреблението е ПО-СЛАБО → възможно забавяне → потенциална подкрепа за златото."
        };
    }


    if(type === "business"){

        return {
            first:
                "Ако показателят е ПО-СИЛЕН → по-силна икономическа активност → възможен натиск върху златото.",

            second:
                "Ако показателят е ПО-СЛАБ → възможно забавяне → потенциална подкрепа за златото."
        };
    }


    return {
        first:
            "Следи Actual спрямо Forecast. По-голямо отклонение от очакваното може да предизвика силно движение.",

        second:
            "За XAUUSD следи едновременно USD, доходността по облигациите и реакцията на самото злато."
    };

}


/* =========================================================
   NEWS IMPORTANCE
========================================================= */

function importance(value){

    const v =
        String(value || "")
        .toLowerCase();


    if(
        v.includes("high") ||
        v === "3" ||
        v === "2"
    ){
        return "ВИСОКА";
    }


    if(
        v.includes("medium") ||
        v.includes("moderate") ||
        v === "1"
    ){
        return "СРЕДНА";
    }


    return "НИСКА";
}


/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews(){

    const next =
        document.getElementById(
            "nextEvent"
        );

    const list =
        document.getElementById(
            "newsList"
        );


    try{

        /*
            САМО ОТ СЕГА ДО 30 ДНИ НАПРЕД.
        */

        const now =
            new Date();


        const future =
            new Date(
                now.getTime()
                +
                30 *
                24 *
                60 *
                60 *
                1000
            );


        const url =
            API +
            "/calendar" +
            "?from=" +
            encodeURIComponent(
                now.toISOString()
            ) +
            "&to=" +
            encodeURIComponent(
                future.toISOString()
            ) +
            "&countries=US" +
            "&importance=low" +
            "&limit=300";


        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){
            throw new Error(
                "Calendar error"
            );
        }


        const data =
            await response.json();


        let events = [];


        if(Array.isArray(data)){
            events = data;
        }
        else if(
            Array.isArray(data.data)
        ){
            events = data.data;
        }
        else if(
            Array.isArray(data.events)
        ){
            events = data.events;
        }


        /*
            МАХАМЕ ВСИЧКО МИНАЛО.
        */

        events =
            events.filter(event => {

                const time =
                    new Date(
                        event.time
                    ).getTime();


                if(
                    !Number.isFinite(time)
                ){
                    return false;
                }


                if(
                    time <= Date.now()
                ){
                    return false;
                }


                /*
                    Ако Actual вече има стойност,
                    новината вече е излязла.
                */

                if(
                    event.actual !== null &&
                    event.actual !== undefined &&
                    event.actual !== ""
                ){
                    return false;
                }


                return true;

            });


        /*
            НАЙ-БЛИЗКАТА ПЪРВА.
        */

        events.sort(
            (a,b) =>
                new Date(a.time)
                -
                new Date(b.time)
        );


        /*
            ПРЕМАХВАМЕ ДУБЛИКАТИ.
        */

        const seen =
            new Set();


        events =
            events.filter(event => {

                const key =
                    `${event.time}|${event.name}|${event.currency}`;


                if(seen.has(key)){
                    return false;
                }


                seen.add(key);

                return true;

            });


        events =
            events.slice(0,40);


        document.getElementById(
            "newsUpdated"
        ).textContent =
            "обновено " +
            new Intl.DateTimeFormat(
                "bg-BG",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ).format(new Date());


        if(events.length === 0){

            next.innerHTML = `
                <div class="error">
                    Няма намерени предстоящи новини
                    за следващите 30 дни.
                </div>
            `;

            list.innerHTML = "";

            return;
        }


        /*
            НАЙ-БЛИЗКА НОВИНА
        */

        next.innerHTML =
            createNextEvent(
                events[0]
            );


        /*
            ВСИЧКИ СЛЕДВАЩИ
        */

        list.innerHTML =
            events
                .map(
                    createNews
                )
                .join("");


    }
    catch(error){

        console.error(
            error
        );


        next.innerHTML = `
            <div class="error">
                Не успях да заредя икономическия календар.
                Провери интернет връзката.
            </div>
        `;

        list.innerHTML = "";
    }

}


/* =========================================================
   NEXT EVENT
========================================================= */

function createNextEvent(event){

    const scenario =
        scenarios(
            event.name
        );


    return `

        <div class="next">

            <div class="next-label">
                СЛЕДВАЩА НОВИНА
            </div>

            <div class="next-name">
                ${escapeHTML(
                    event.name ||
                    "Икономическо събитие"
                )}
            </div>

            <div class="next-date">

                ${dateTime(event.time)}

                ·

                ${escapeHTML(
                    event.currency ||
                    "USD"
                )}

            </div>

            <div
                class="countdown"
                data-time="${escapeHTML(
                    event.time
                )}">

                ${countdown(event.time)}

            </div>


            <div class="badges">

                <div class="badge">
                    Forecast:
                    ${escapeHTML(
                        event.forecast ??
                        "—"
                    )}
                </div>

                <div class="badge">
                    Previous:
                    ${escapeHTML(
                        event.previous ??
                        "—"
                    )}
                </div>

                <div class="badge high">
                    ${importance(
                        event.importance
                    )}
                </div>

            </div>


            <div class="scenario up-scenario">

                <strong>
                    Първи сценарий
                </strong>

                ${scenario.first}

            </div>


            <div class="scenario down-scenario">

                <strong>
                    Втори сценарий
                </strong>

                ${scenario.second}

            </div>

        </div>
    `;
}


/* =========================================================

========================================================= */

        scenarios(
            event.name
        );


    const imp =
        importance(
            event.importance
        );


    return `

        <div class="news">

            <div class="news-top">

                <div>

                    <div class="news-name">
                        ${escapeHTML(
                            event.name ||
                            "Икономическо събитие"
                        )}
                    </div>

                    <div class="currency">
                        ${escapeHTML(
                            event.currency ||
                            "USD"
                        )}
                    </div>

                </div>


                <div class="news-date">

                    ${dateTime(
                        event.time
                    )}

                    <br>

                    <span
                        class="countdown"
                        data-time="${escapeHTML(
                            event.time
                        )}">

                        ${countdown(
                            event.time
                        )}

                    </span>

                </div>

            </div>


            <div
                class="${
                    imp === "ВИСОКА"
                    ? "high"
                    : imp === "СРЕДНА"
                    ? "medium"
                    : ""
                }"
                style="
                    font-size:10px;
                    font-weight:800;
                    margin-top:9px;
                "
            >
                ● ${imp} ВАЖНОСТ
            </div>


            <div class="values">

                <div class="value-box">

                    <div class="value-label">
                        ACTUAL
                    </div>

                    <div class="value">
                        —
                    </div>

                </div>


                <div class="value-box">

                    <div class="value-label">
                        FORECAST
                    </div>

                    <div class="value">

                        ${escapeHTML(
                            event.forecast ??
                            "—"
                        )}

                    </div>

                </div>


                <div class="value-box">

                    <div class="value-label">
                        PREVIOUS
                    </div>

                    <div class="value">

                        ${escapeHTML(
                            event.previous ??
                            "—"
                        )}

                    </div>

                </div>

            </div>


            <div class="scenario up-scenario">

                <strong>
                    Ако резултатът е по-висок:
                </strong>

                ${scenario.first}

            </div>


            <div class="scenario down-scenario">

                <strong>
                    Ако резултатът е по-нисък:
                </strong>

                ${scenario.second}

            </div>

        </div>
    `;
}


/* =========================================================
   COUNTDOWN UPDATE
========================================================= */

function updateCountdowns(){

    document
        .querySelectorAll(
            "[data-time]"
        )
        .forEach(element => {

            element.textContent =
                countdown(
                    element.dataset.time
                );

        });

}


/* =========================================================
   START
========================================================= */

async function start(){

    await loadPrice();

    await analyze();

    await loadNews();

}


start();


/* =========================================================
   AUTO UPDATE
========================================================= */

setInterval(
    loadPrice,
    15000
);


setInterval(

    60000
);


setInterval(

    300000
);


setInterval(
    updateCountdowns,
    30000

</script>
