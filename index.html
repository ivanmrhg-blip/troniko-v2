<!DOCTYPE html>
<html lang="bg"
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0f">
<title>XAUUSD Analyzer</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#080a0f;
    color:#f5f7fa;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
    max-width:700px;
    margin:auto;
    padding:16px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.online{
    font-size:12px;
    padding:7px 10px;
    border-radius:20px;
    background:#151a22;
    color:#43d98a;
}

.card{
    background:#11151d;
    border:1px solid #222833;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.label{
    color:#7f8997;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:7px;
}

.price{
    font-size:40px;
    font-weight:900;
}

.signal-box{
    text-align:center;
    padding:30px 15px;
}

.signal-label{
    font-size:12px;
    color:#818b99;
    letter-spacing:1.5px;
    margin-bottom:10px;
}

.signal{
    font-size:48px;
    font-weight:950;
}

.up{
    color:#38d981;
}

.down{
    color:#ff5263;
}

.signal-info{
    margin-top:10px;
    color:#9ca5b2;
    font-size:13px;
}

.section{
    font-size:18px;
    font-weight:800;
    margin-bottom:14px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:#181d26;
    border-radius:12px;
    padding:13px;
}

.stat small{
    display:block;
    color:#7e8794;
    font-size:10px;
    margin-bottom:6px;
}

.stat strong{
    font-size:16px;
}

.news-main{
    background:#151a22;
    border-radius:15px;
    padding:16px;
}

.news-name{
    font-size:20px;
    font-weight:800;
}

.news-date{
    color:#89929f;
    font-size:12px;
    margin-top:5px;
}

.timer{
    margin-top:13px;
    font-size:17px;
    font-weight:800;
}

.impact{
    margin-top:15px;
    border-radius:13px;
    padding:15px;
}

.impact.up{
    background:#10251b;
    border:1px solid #245c3e;
}

.impact.down{
    background:#291419;
    border:1px solid #71313c;
}

.impact-title{
    color:#8d97a4;
    font-size:11px;
    margin-bottom:5px;
}

.impact-direction{
    font-size:22px;
    font-weight:950;
}

.impact.up .impact-direction{
    color:#38d981;
}

.impact.down .impact-direction{
    color:#ff5263;
}

.reason{
    margin-top:9px;
    color:#c1c7cf;
    font-size:13px;
    line-height:1.5;
}

.news-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.news{
    background:#151a22;
    border:1px solid #232a35;
    border-radius:13px;
    padding:13px;
}

.news-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.news-title{
    font-weight:750;
    font-size:14px;
}

.news-time{
    color:#858f9d;
    font-size:11px;
    margin-top:5px;
}

.news-direction{
    margin-top:9px;
    font-size:13px;
    font-weight:850;
}

.news-direction.up{color:#38d981}
.news-direction.down{color:#ff5263}

.news-reason{
    color:#959eaa;
    font-size:12px;
    line-height:1.45;
    margin-top:4px;
}

.empty{
    color:#838c99;
    text-align:center;
    font-size:13px;
    padding:15px 0;
}

.footer{
    text-align:center;
    color:#59616d;
    font-size:10px;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">XAUUSD Analyzer</div>
    <div class="online" id="status">● Свързване</div>
</header>


<!-- PRICE -->

<div class="card">

    <div class="label">XAUUSD</div>

    <div class="price" id="price">
        —
    </div>

</div>


<!-- =====================================================
     ЕДИНСТВЕНА ПОСОКА
     ===================================================== -->

<div class="card signal-box">

    <div class="signal-label">
        КРАЙНА ПОСОКА
    </div>

    <div id="finalSignal" class="signal up">
        АНАЛИЗ...
    </div>

    <div id="signalInfo" class="signal-info">
        Изчисляване на пазара...
    </div>

</div>


<!-- TRADE PLAN -->

<div class="card">

    <div class="section">
        План
    </div>

    <div class="grid">

        <div class="stat">
            <small>ENTRY</small>
            <strong id="entry">—</strong>
        </div>

        <div class="stat">
            <small>STOP LOSS</small>
            <strong id="stop">—</strong>
        </div>

        <div class="stat">
            <small>TAKE PROFIT</small>
            <strong id="take">—</strong>
        </div>

        <div class="stat">
            <small>R:R</small>
            <strong>1 : 2</strong>
        </div>

    </div>

</div>


<!-- NEXT NEWS -->

<div class="card">

    <div class="section">
        Следваща новина
    </div>

    <div id="nextNews">
        <div class="empty">
            Зареждане...
        </div>
    </div>

</div>


<!-- UPCOMING NEWS -->

<div class="card">

    <div class="section">
        Предстоящи новини
    </div>

    <div id="newsList" class="news-list">

        <div class="empty">
            Зареждане...
        </div>

    </div>

</div>


<div class="footer">
    XAUUSD Analyzer · автоматично обновяване
</div>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const API = "https://biquote.io/api";

let price = null;


/* =========================================================
   PRICE
   ========================================================= */

async function loadPrice(){

    try{

        const r = await fetch(
            API + "/XAUUSD?allowStale=true",
            {cache:"no-store"}
        );

        const d = await r.json();

        price =
            Number(d.mid) ||
            Number(d.price) ||
            Number(d.last) ||
            Number(d.bid);

        if(!price) throw new Error();

        document.getElementById("price").textContent =
            "$" + price.toLocaleString("en-US",{
                minimumFractionDigits:2,
                maximumFractionDigits:2
            });

        document.getElementById("status").textContent =
            "● Онлайн";

    }catch(e){

        document.getElementById("status").textContent =
            "● Offline";

    }

}


/* =========================================================
   OHLC
   ========================================================= */

async function candles(interval){

    const r = await fetch(
        API +
        "/XAUUSD/ohlc?interval=" +
        interval +
        "&limit=100",
        {cache:"no-store"}
    );

    if(!r.ok) throw new Error();

    const d = await r.json();

    if(Array.isArray(d)) return d;
    if(Array.isArray(d.data)) return d.data;
    if(Array.isArray(d.bars)) return d.bars;

    return [];
}


function closePrice(c){

    if(Array.isArray(c))
        return Number(c[4]);

    return Number(
        c.close ??
        c.c
    );
}


/* =========================================================
   INTERNAL MARKET CALCULATION
   =========================================================

   ВАЖНО:

   Тук се използват 4H, 1H и 15M.

   НО ТЕЗИ ПОСОКИ НЕ СЕ ПОКАЗВАТ.

   Те се обединяват в ЕДНА крайна посока.
   ========================================================= */

function direction(candles){

    const closes =
        candles
        .map(closePrice)
        .filter(x => Number.isFinite(x));

    if(closes.length < 30)
        return 0;

    const short =
        closes.slice(-12);

    const long =
        closes.slice(-30,-12);

    const shortAvg =
        short.reduce((a,b)=>a+b,0) /
        short.length;

    const longAvg =
        long.reduce((a,b)=>a+b,0) /
        long.length;

    const last =
        closes[closes.length-1];

    const first =
        closes[closes.length-13];

    const momentum =
        last - first;

    if(shortAvg > longAvg && momentum > 0)
        return 1;

    if(shortAvg < longAvg && momentum < 0)
        return -1;

    return 0;
}


/* =========================================================
   FINAL SIGNAL
   ========================================================= */

async function analyzeMarket(){

    try{

        const h4 = await candles("4h");
        const h1 = await candles("1h");
        const m15 = await candles("15m");

        const d4 =
            direction(h4);

        const d1 =
            direction(h1);

        const d15 =
            direction(m15);


        /*
           Вътрешно обединяване.

           4H има най-голяма тежест.
           1H потвърждава.
           15M уточнява входа.
        */

        const score =
            d4 * 50 +
            d1 * 30 +
            d15 * 20;


        /*
           НИКОГА НЕ ПОКАЗВАМЕ
           ТРИТЕ ПОСОКИ.

           Само крайния резултат.
        */

        let finalDirection;


        if(score >= 30){

            finalDirection = "НАГОРЕ";

        }else{

            finalDirection = "НАДОЛУ";

        }


        const element =
            document.getElementById("finalSignal");

        element.textContent =
            finalDirection;

        element.className =
            "signal " +
            (
                finalDirection === "НАГОРЕ"
                ? "up"
                : "down"
            );


        document.getElementById("signalInfo").textContent =
            "Една обединена посока от техническия анализ";


        makePlan(finalDirection);

    }
    catch(e){

        /*
           Ако API не отговори,
           не измисляме сигнал.
        */

        document.getElementById("finalSignal").textContent =
            "НЯМА ДАННИ";

        document.getElementById("finalSignal").className =
            "signal";

        document.getElementById("signalInfo").textContent =
            "Изчакай обновяване на данните";
    }

}


/* =========================================================
   PLAN
   ========================================================= */

function makePlan(direction){

    if(!price) return;

    const risk =
        Math.max(price * 0.003,8);

    let sl;
    let tp;

    if(direction === "НАГОРЕ"){

        sl = price - risk;
        tp = price + risk * 2;

    }else{

        sl = price + risk;
        tp = price - risk * 2;

    }

    document.getElementById("entry").textContent =
        price.toFixed(2);

    document.getElementById("stop").textContent =
        sl.toFixed(2);

    document.getElementById("take").textContent =
        tp.toFixed(2);

}


/* =========================================================
   NEWS
   ========================================================= */

async function loadNews(){

    try{

        const now =
            new Date();

        const end =
            new Date(
                now.getTime() +
                30 * 24 * 60 * 60 * 1000
            );

        const url =
            API +
            "/calendar" +
            "?from=" +
            encodeURIComponent(now.toISOString()) +
            "&to=" +
            encodeURIComponent(end.toISOString()) +
            "&countries=US" +
            "&importance=low" +
            "&limit=300";


        const r =
            await fetch(
                url,
                {cache:"no-store"}
            );


        if(!r.ok)
            throw new Error();


        const raw =
            await r.json();


        const list =
            Array.isArray(raw)
            ? raw
            : (
                raw.data ||
                raw.events ||
                []
            );


        const events =
            list
            .map(normalize)
            .filter(x =>
                x.time &&
                x.time.getTime() > Date.now()
            )
            .filter(x =>
                x.actual === null ||
                x.actual === undefined ||
                x.actual === ""
            )
            .sort(
                (a,b)=>
                a.time-b.time
            );


        renderNext(events);
        renderList(events);

    }
    catch(e){

        document.getElementById("nextNews").innerHTML =
            `<div class="empty">
                Новините не могат да бъдат заредени.
             </div>`;

    }

}


function normalize(e){

    return {

        name:
            e.name ||
            e.title ||
            "Икономическа новина",

        time:
            new Date(
                e.time ||
                e.date ||
                e.datetime
            ),

        forecast:
            number(e.forecast),

        previous:
            number(e.previous),

        actual:
            e.actual,

        currency:
            e.currency ||
            "USD",

        importance:
            e.importance

    };

}


function number(v){

    if(
        v === null ||
        v === undefined ||
        v === ""
    )
        return null;

    const n =
        Number(
            String(v)
            .replace(",",".")
        );

    return Number.isFinite(n)
        ? n
        : null;

}


/* =========================================================
   NEWS DIRECTION
   ========================================================= */

function newsDirection(event){

    const name =
        event.name.toLowerCase();

    const f =
        event.forecast;

    const p =
        event.previous;


    if(
        f === null ||
        p === null ||
        f === p
    ){

        return {

            direction:"down",

            title:
                "ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ",

            reason:
                "Алгоритъмът използва базов сценарий за тази новина."

        };

    }


    const higher =
        f > p;


    /*
       Новини, при които
       по-силни данни = натиск
       върху златото.
    */

    const pressureDown = [

        "cpi",
        "inflation",
        "nonfarm",
        "payroll",
        "employment",
        "nfp",
        "adp",
        "gdp",
        "retail sales",
        "consumer spending",
        "pmi",
        "ism",
        "manufacturing",
        "services",
        "consumer confidence",
        "consumer sentiment",
        "housing",
        "home sales",
        "building permits",
        "housing starts"

    ];


    /*
       Безработица:

       По-висока безработица =
       очаквано нагоре за златото.
    */

    if(
        name.includes("unemployment") ||
        name.includes("jobless claims") ||
        name.includes("initial claims") ||
        name.includes("continuing claims")
    ){

        if(higher){

            return {

                direction:"up",

                title:
                    "ОЧАКВАМЕ: ЗЛАТОТО НАГОРЕ",

                reason:
                    `Forecast (${f}) е по-висок от Previous (${p}). Очакват се по-слаби данни за пазара на труда, което подкрепя златото.`

            };

        }else{

            return {

                direction:"down",

                title:
                    "ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ",

                reason:
                    `Forecast (${f}) е по-нисък от Previous (${p}). Очакват се по-силни данни за пазара на труда, което оказва натиск върху златото.`

            };

        }

    }


    /*
       Всички основни икономически показатели.
    */

    if(
        pressureDown.some(
            x => name.includes(x)
        )
    ){

        if(higher){

            return {

                direction:"down",

                title:
                    "ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ",

                reason:
                    `${friendlyName(event.name)} се очаква да бъде по-силна: Forecast ${f} спрямо Previous ${p}. Това обикновено подкрепя долара и оказва натиск върху златото.`

            };

        }else{

            return {

                direction:"up",

                title:
                    "ОЧАКВАМЕ: ЗЛАТОТО НАГОРЕ",

                reason:
                    `${friendlyName(event.name)} се очаква да бъде по-слаба: Forecast ${f} спрямо Previous ${p}. Това обикновено подкрепя златото.`

            };

        }

    }


    /*
       Ако новината не е разпознаваема,
       пак даваме ЕДНА посока,
       вместо три сценария.
    */

    return {

        direction:
            higher
            ? "down"
            : "up",

        title:
            higher
            ? "ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ"
            : "ОЧАКВАМЕ: ЗЛАТОТО НАГОРЕ",

        reason:
            `Forecast ${f} спрямо Previous ${p}. Алгоритъмът очаква съответното базово влияние върху златото.`

    };

}


/* =========================================================
   ПО-РАЗБИРАЕМО ИМЕ
   ========================================================= */

function friendlyName(name){

    const n =
        name.toLowerCase();

    if(n.includes("cpi"))
        return "Инфлацията";

    if(
        n.includes("nfp") ||
        n.includes("nonfarm") ||
        n.includes("payroll")
    )
        return "Работните места";

    if(n.includes("gdp"))
        return "Икономическият растеж";

    if(n.includes("retail sales"))
        return "Продажбите";

    if(n.includes("pmi"))
        return "Бизнес активността";

    if(n.includes("ism"))
        return "Бизнес активността";

    if(n.includes("unemployment"))
        return "Безработицата";

    return name;

}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function countdown(date){

    const diff =
        date.getTime() -
        Date.now();

    if(diff <= 0)
        return "Започва сега";

    const minutes =
        Math.floor(
            diff / 60000
        );

    const days =
        Math.floor(
            minutes / 1440
        );

    const hours =
        Math.floor(
            (minutes % 1440) / 60
        );

    const mins =
        minutes % 60;


    if(days)
        return `След ${days}д ${hours}ч ${mins}м`;

    if(hours)
        return `След ${hours}ч ${mins}м`;

    return `След ${mins}м`;

}


/* =========================================================
   DATE
   ========================================================= */

function dateBG(date){

    return new Intl.DateTimeFormat(
        "bg-BG",
        {
            timeZone:"Europe/Sofia",
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(date);

}


/* =========================================================
   NEXT NEWS
   ========================================================= */

function renderNext(events){

    const box =
        document.getElementById("nextNews");


    if(!events.length){

        box.innerHTML =
            `<div class="empty">
                Няма предстоящи новини.
             </div>`;

        return;
    }


    const e =
        events[0];

    const impact =
        newsDirection(e);


    box.innerHTML = `

        <div class="news-main">

            <div class="news-name">
                ${safe(e.name)}
            </div>

            <div class="news-date">
                ${e.currency} · ${dateBG(e.time)}
            </div>

            <div class="timer">
                ${countdown(e.time)}
            </div>

            <div class="grid" style="margin-top:14px">

                <div class="stat">
                    <small>FORECAST</small>
                    <strong>
                        ${e.forecast ?? "—"}
                    </strong>
                </div>

                <div class="stat">
                    <small>PREVIOUS</small>
                    <strong>
                        ${e.previous ?? "—"}
                    </strong>
                </div>

            </div>

            <div class="impact ${impact.direction}">

                <div class="impact-title">
                    ОЧАКВАНО ДВИЖЕНИЕ
                </div>

                <div class="impact-direction">
                    ${impact.title}
                </div>

                <div class="reason">
                    ${impact.reason}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   NEWS LIST
   ========================================================= */

function renderList(events){

    const box =
        document.getElementById("newsList");


    if(!events.length){

        box.innerHTML =
            `<div class="empty">
                Няма предстоящи събития.
             </div>`;

        return;
    }


    box.innerHTML =
        events
        .slice(0,20)
        .map(e => {

            const impact =
                newsDirection(e);

            return `

                <div class="news">

                    <div class="news-top">

                        <div class="news-title">
                            ${safe(e.name)}
                        </div>

                    </div>

                    <div class="news-time">
                        ${dateBG(e.time)}
                        ·
                        ${countdown(e.time)}
                    </div>

                    <div class="grid" style="margin-top:9px">

                        <div class="stat">
                            <small>FORECAST</small>
                            <strong>
                                ${e.forecast ?? "—"}
                            </strong>
                        </div>

                        <div class="stat">
                            <small>PREVIOUS</small>
                            <strong>
                                ${e.previous ?? "—"}
                            </strong>
                        </div>

                    </div>

                    <div class="news-direction ${impact.direction}">
                        ${impact.title}
                    </div>

                    <div class="news-reason">
                        ${impact.reason}
                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   SECURITY
   ========================================================= */

function safe(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   START
   ========================================================= */

async function start(){

    await loadPrice();

    await analyzeMarket();

    await loadNews();

}


/* =========================================================
   AUTO UPDATE
   ========================================================= */

setInterval(
    loadPrice,
    15000
);

setInterval(
    analyzeMarket,
    60000
);

setInterval(
    loadNews,
    60000
);

start();

</script>

</body>
</html>
