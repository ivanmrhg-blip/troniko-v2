<title>XAUUSD Analyzer</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

.app{
    width:100%;
    max-width:700px;

    padding:18px 14px 40px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.status{
    font-size:12px;
    padding:7px 10px;
    border-radius:20px;
    background:#151922;
    color:#9ca5b3;
}

.card{
    background:#10131a;
    border:1px solid #202531;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.label{
    color:#858e9d;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:8px;
}

.price{
    font-size:38px;
    font-weight:800;
}

.price-change{
    margin-top:5px;
    font-size:14px;
}

    text-align:center;
    padding:25px 18px;
}

.signal-title{
    color:#8c95a3;
    font-size:13px;

    margin-bottom:12px;
}

.signal{
    font-size:42px;
    font-weight:900;
    margin-bottom:12px;
}

    color:#35d07f;
}

.signal.down{
    color:#ff5364;
}

}

.strength{
    display:inline-block;
    background:#181d26;
    padding:8px 13px;
    border-radius:20px;
    font-size:13px;
    color:#b7bfca;
}

.section-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:#171b23;
    border-radius:12px;
    padding:13px;
}

.stat span{
    display:block;
    color:#858e9d;
    font-size:11px;
    margin-bottom:6px;
}

.stat strong{
    font-size:16px;
}

.news-main{
    border:1px solid #29303b;
    background:#141820;
}

.news-name{
    font-size:21px;
    font-weight:800;
    margin-bottom:6px;
}

.news-meta{
    color:#8d96a4;
    font-size:13px;
    margin-bottom:16px;
}

.countdown{
    font-size:16px;
    font-weight:700;
    margin-bottom:15px;
}

.impact{
    border-radius:14px;
    padding:15px;
    margin-top:12px;
    background:#191e27;
}

.impact.up{
    border:1px solid #235e42;
}

.impact.down{
    border:1px solid #71313b;
}

.impact.neutral{
    border:1px solid #3b414b;
}

.impact-title{
    font-size:12px;
    color:#8d96a4;
    margin-bottom:6px;
}

.impact-direction{
    font-size:22px;
    font-weight:900;
}

.impact.up .impact-direction{
    color:#35d07f;
}

.impact.down .impact-direction{
    color:#ff5364;
}

.reason{
    margin-top:10px;
    font-size:13px;
    line-height:1.5;
    color:#c1c7d0;
}

.news-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.news-item{
    background:#151920;
    border:1px solid #222833;
    border-radius:14px;
    padding:14px;
}

.news-item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.news-item-name{
    font-weight:700;
    font-size:15px;
}

.importance{
    font-size:11px;
    color:#f0bd57;
    white-space:nowrap;
}

.news-time{
    color:#8b94a2;
    font-size:12px;
    margin-top:5px;
}

.news-impact{
    margin-top:10px;
    font-size:13px;
    font-weight:800;
}

.news-impact.up{

}

.news-impact.down{

}

.news-impact.neutral{
    color:#b5bdc8;
}

.news-reason{
    color:#9da6b3;
    font-size:12px;
    line-height:1.45;
    margin-top:5px;
}

    color:#8e97a5;
    text-align:center;
    padding:20px 5px;
    font-size:14px;
}

.footer{
    text-align:center;
    color:#626b79;
    font-size:11px;
    margin-top:20px;
}

.error{
    color:#ff6876;
    font-size:12px;
    margin-top:8px;
}

    .price{
        font-size:32px;
    }

    .signal{
        font-size:35px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">XAUUSD Analyzer</div>
    <div class="status" id="status">Свързване...</div>
</header>

<!-- PRICE -->
<div class="card">
    <div class="label">ЗЛАТО / USD</div>
    <div class="price" id="price">—</div>
    <div class="price-change" id="priceChange">Зареждане...</div>
</div>

<!-- ONLY ONE FINAL DIRECTION -->
<div class="card signal-card">

    <div class="signal-title">КРАЕН СИГНАЛ</div>

    <div id="signal" class="signal none">
        —
    </div>

    <div class="strength" id="strength">
        Анализиране...
    </div>

</div>

<!-- TRADE PLAN -->
<div class="card">

    <div class="section-title">План</div>

    <div class="grid">

        <div class="stat">
            <span>ENTRY</span>
            <strong id="entry">—</strong>
        </div>

        <div class="stat">
            <span>STOP LOSS</span>
            <strong id="sl">—</strong>
        </div>

        <div class="stat">
            <span>TAKE PROFIT</span>
            <strong id="tp">—</strong>
        </div>

        <div class="stat">
            <span>RISK / REWARD</span>
            <strong id="rr">—</strong>
        </div>

    </div>

</div>

<!-- NEXT NEWS -->
<div class="card">

    <div class="section-title">Следваща важна новина</div>

    <div id="nextNews">
        <div class="empty">Зареждане...</div>
    </div>

</div>

<!-- ALL UPCOMING NEWS -->
<div class="card">

    <div class="section-title">Предстоящи новини</div>

    <div id="newsList" class="news-list">
        <div class="empty">Зареждане...</div>
    </div>

</div>

<div class="footer">
    Данните се обновяват автоматично
</div>

</div>

<script>

/* =========================================================
   XAUUSD ANALYZER
   ========================================================= */

const API = "https://biquote.io/api";

let currentPrice = null;
let lastPrice = null;


/* =========================================================
   HELPERS
   ========================================================= */

function num(value){
    if(value === null || value === undefined || value === "") {
        return null;
    }

    const n = Number(String(value).replace(",", "."));

    return Number.isFinite(n) ? n : null;
}


function formatPrice(value){
    if(value === null) return "—";

    return Number(value).toLocaleString("en-US",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}


function formatDate(date){
    return new Intl.DateTimeFormat("bg-BG",{
        timeZone:"Europe/Sofia",
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
    }).format(date);
}


function countdown(date){

    const diff = new Date(date).getTime() - Date.now();

    if(diff <= 0) return "Събитието започва";

    const minutes = Math.floor(diff / 60000);

    const days = Math.floor(minutes / 1440);
    const hours = Math.floor((minutes % 1440) / 60);
    const mins = minutes % 60;

    if(days > 0){
        return `След ${days}д ${hours}ч ${mins}м`;
    }

    if(hours > 0){
        return `След ${hours}ч ${mins}м`;
    }

    return `След ${mins}м`;
}


/* =========================================================
   PRICE
   ========================================================= */

async function loadPrice(){

    try{

        const response = await fetch(
            `${API}/XAUUSD?allowStale=true`,
            {cache:"no-store"}
        );

        if(!response.ok) throw new Error();

        const data = await response.json();

        let price =
            num(data.mid) ??
            num(data.price) ??
            num(data.last) ??
            num(data.bid);

        if(price === null) throw new Error();

        lastPrice = currentPrice;
        currentPrice = price;

        document.getElementById("price").textContent =
            "$" + formatPrice(price);

        if(lastPrice !== null){

            const diff = price - lastPrice;

            if(diff > 0){
                document.getElementById("priceChange").textContent =
                    `▲ +${diff.toFixed(2)}`;
            }
            else if(diff < 0){
                document.getElementById("priceChange").textContent =
                    `▼ ${diff.toFixed(2)}`;
            }
            else{
                document.getElementById("priceChange").textContent =
                    "Без промяна";
            }
        }

        document.getElementById("status").textContent = "● Онлайн";

        document.getElementById("status").style.color = "#35d07f";

    }
    catch(error){

        document.getElementById("status").textContent =
            "Няма връзка";

        document.getElementById("status").style.color =
            "#ff5364";
    }
}


/* =========================================================
   TECHNICAL ANALYSIS
   INTERNAL:
   4H -> 1H -> 15M

   IMPORTANT:
   THE USER ONLY SEES ONE FINAL DIRECTION.
   ========================================================= */

async function getBars(interval){

    const response = await fetch(
        `${API}/XAUUSD/ohlc?interval=${interval}&limit=150`,
        {cache:"no-store"}
    );

    if(!response.ok) throw new Error();

    const data = await response.json();

    if(Array.isArray(data)) return data;

    if(Array.isArray(data.data)) return data.data;

    if(Array.isArray(data.bars)) return data.bars;

    return [];
}


function getClose(bar){

    if(Array.isArray(bar)){
        return num(bar[4]);
    }

    return (
        num(bar.close) ??
        num(bar.c) ??
        num(bar.Close)
    );
}


function calculateDirection(bars){

    const closes = bars
        .map(getClose)
        .filter(x => x !== null);

    if(closes.length < 30) return 0;

    const recent = closes.slice(-10);
    const previous = closes.slice(-20,-10);

    const recentAverage =
        recent.reduce((a,b)=>a+b,0) / recent.length;

    const previousAverage =
        previous.reduce((a,b)=>a+b,0) / previous.length;

    const move =
        closes[closes.length-1] -
        closes[closes.length-11];

    const averageDifference =
        recentAverage - previousAverage;

    /*
       Internal score only.
       It is NEVER displayed as a separate timeframe signal.
    */

    if(averageDifference > 0 && move > 0){
        return 1;
    }

    if(averageDifference < 0 && move < 0){
        return -1;
    }

    return 0;
}


async function technicalAnalysis(){

    try{

        const bars4h = await getBars("4h");
        const bars1h = await getBars("1h");
        const bars15m = await getBars("15m");

        const d4h = calculateDirection(bars4h);
        const d1h = calculateDirection(bars1h);
        const d15m = calculateDirection(bars15m);

        /*
          WEIGHT:
          4H = 50%
          1H = 30%
          15M = 20%
        */

        const score =
            d4h * 0.50 +
            d1h * 0.30 +
            d15m * 0.20;

        let finalSignal = "NO TRADE";
        let signalClass = "none";

        if(score >= 0.60){

            finalSignal = "НАГОРЕ";
            signalClass = "up";

        }
        else if(score <= -0.60){

            finalSignal = "НАДОЛУ";
            signalClass = "down";

        }

        const signalElement =
            document.getElementById("signal");

        signalElement.textContent = finalSignal;

        signalElement.className =
            `signal ${signalClass}`;

        /*
          Strength is not a prediction probability.
          It simply shows how strongly the internal
          timeframes agree.
        */

        const strength =
            Math.round(Math.abs(score) * 100);

        document.getElementById("strength").textContent =
            finalSignal === "NO TRADE"
            ? "Няма достатъчно потвърждение"
            : `Сила на сигнала: ${strength}%`;

        createTradePlan(finalSignal);

    }
    catch(error){

        document.getElementById("signal").textContent =
            "БЕЗ СИГНАЛ";

        document.getElementById("signal").className =
            "signal none";

        document.getElementById("strength").textContent =
            "Няма достатъчно данни";
    }
}


/* =========================================================
   TRADE PLAN
   ========================================================= */

function createTradePlan(signal){

    if(currentPrice === null) return;

    if(signal !== "НАГОРЕ" && signal !== "НАДОЛУ"){

        document.getElementById("entry").textContent = "—";
        document.getElementById("sl").textContent = "—";
        document.getElementById("tp").textContent = "—";
        document.getElementById("rr").textContent = "—";

        return;
    }

    const entry = currentPrice;

    /*
      Basic 1:2 plan.
      This is an algorithmic example, not a guarantee.
    */

    const risk = Math.max(entry * 0.003, 8);

    let sl;
    let tp;

    if(signal === "НАГОРЕ"){

        sl = entry - risk;
        tp = entry + risk * 2;

    }
    else{

        sl = entry + risk;
        tp = entry - risk * 2;

    }

    document.getElementById("entry").textContent =
        formatPrice(entry);

    document.getElementById("sl").textContent =
        formatPrice(sl);

    document.getElementById("tp").textContent =
        formatPrice(tp);

    document.getElementById("rr").textContent =
        "1 : 2";
}


/* =========================================================
   NEWS
   ========================================================= */

async function loadNews(){

    try{

        const now = new Date();

        const future = new Date(
            now.getTime() + 30 * 24 * 60 * 60 * 1000
        );

        const from = now.toISOString();
        const to = future.toISOString();

        const url =
            `${API}/calendar` +
            `?from=${encodeURIComponent(from)}` +
            `&to=${encodeURIComponent(to)}` +
            `&countries=US` +
            `&importance=low` +
            `&limit=300`;

        const response = await fetch(
            url,
            {cache:"no-store"}
        );

        if(!response.ok) throw new Error();

        const raw = await response.json();

        const events =
            Array.isArray(raw)
            ? raw
            : (
                Array.isArray(raw.data)
                ? raw.data
                : (
                    Array.isArray(raw.events)
                    ? raw.events
                    : []
                )
            );

        /*
          ONLY FUTURE EVENTS.
          No old news.
        */

        const upcoming = events
            .map(normalizeEvent)
            .filter(event => event.time)
            .filter(event =>
                event.time.getTime() > Date.now()
            )
            .filter(event =>
                event.actual === null ||
                event.actual === undefined ||
                event.actual === ""
            )
            .sort((a,b) =>
                a.time.getTime() - b.time.getTime()
            );

        renderNextNews(upcoming);
        renderNewsList(upcoming);

    }
    catch(error){

        document.getElementById("nextNews").innerHTML =
            `<div class="empty">
                Не успях да заредя новините.
             </div>`;

        document.getElementById("newsList").innerHTML =
            `<div class="empty">
                Провери интернет връзката.
             </div>`;
    }
}


/* =========================================================
   NORMALIZE NEWS
   ========================================================= */

function normalizeEvent(e){

    const timeValue =
        e.time ??
        e.date ??
        e.datetime ??
        e.timestamp;

    let date = new Date(timeValue);

    if(Number.isNaN(date.getTime())){
        date = null;
    }

    return {

        raw:e,

        time:date,

        name:
            e.name ??
            e.title ??
            "Икономическо събитие",

        currency:
            e.currency ??
            "USD",

        importance:
            e.importance ??
            "medium",

        forecast:
            num(e.forecast),

        previous:
            num(e.previous),

        revisedPrevious:
            num(e.revisedPrevious),

        unit:
            e.unit ??
            "",

        actual:
            e.actual,

        country:
            e.countryCode ??
            "US"
    };
}


/* =========================================================
   NEWS CATEGORY
   ========================================================= */

function classifyNews(name){

    const n = name.toLowerCase();

    if(
        n.includes("cpi") ||
        n.includes("inflation") ||
        n.includes("consumer price")
    ){
        return "inflation";
    }

    if(
        n.includes("nfp") ||
        n.includes("nonfarm") ||
        n.includes("payroll") ||
        n.includes("employment") ||
        n.includes("adp") ||
        n.includes("job openings") ||
        n.includes("jolts")
    ){
        return "jobs";
    }

    if(
        n.includes("unemployment") ||
        n.includes("jobless claims") ||
        n.includes("initial claims") ||
        n.includes("continuing claims")
    ){
        return "unemployment";
    }

    if(
        n.includes("gdp") ||
        n.includes("gross domestic")
    ){
        return "gdp";
    }

    if(
        n.includes("retail sales") ||
        n.includes("consumer spending")
    ){
        return "retail";
    }

    if(
        n.includes("pmi") ||
        n.includes("ism") ||
        n.includes("manufacturing") ||
        n.includes("services index")
    ){
        return "business";
    }

    if(
        n.includes("consumer confidence") ||
        n.includes("consumer sentiment")
    ){
        return "confidence";
    }

    if(
        n.includes("housing") ||
        n.includes("home sales") ||
        n.includes("building permits") ||
        n.includes("housing starts")
    ){
        return "housing";
    }

    if(
        n.includes("interest rate") ||
        n.includes("fed funds") ||
        n.includes("rate decision") ||
        n.includes("fomc")
    ){
        return "rates";
    }

    return "other";
}


/* =========================================================
   DIRECTIONAL NEWS ENGINE

   ONE EXPECTED DIRECTION ONLY.

   The algorithm compares Forecast vs Previous.

   IMPORTANT:
   This is an EXPECTED BASELINE IMPACT,
   not a guarantee of the actual market reaction.
   ========================================================= */

function getNewsImpact(event){

    const category =
        classifyNews(event.name);

    let forecast = event.forecast;
    let previous =
        event.revisedPrevious ??
        event.previous;

    if(forecast === null || previous === null){

        return {
            direction:"neutral",
            title:"НЯМА ДОСТАТЪЧНО ДАННИ",
            reason:
                "Няма едновременно Forecast и Previous, от които да се изчисли една предварителна посока."
        };
    }

    let higher = forecast > previous;
    let lower = forecast < previous;

    if(forecast === previous){

        return {
            direction:"neutral",
            title:"БЕЗ ЯСНА ПОСОКА",
            reason:
                "Forecast и Previous са еднакви, затова базовото сравнение не дава посока."
        };
    }


    /*
      HIGHER DATA = MORE PRESSURE ON GOLD
    */

    if(
        category === "inflation" ||
        category === "jobs" ||
        category === "gdp" ||
        category === "retail" ||
        category === "business" ||
        category === "confidence" ||
        category === "housing"
    ){

        if(higher){

            return {
                direction:"down",
                title:"ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ",
                reason:
                    `Forecast (${formatValue(event,forecast)}) е по-висок от Previous (${formatValue(event,previous)}). Това означава по-силни икономически данни и очакван натиск върху златото.`
            };

        }
        else{

            return {
                direction:"up",
                title:"ОЧАКВАМЕ: ЗЛАТОТО НАГОРЕ",
                reason:
                    `Forecast (${formatValue(event,forecast)}) е по-нисък от Previous (${formatValue(event,previous)}). Това означава по-слаби икономически данни и очаквана подкрепа за златото.`
            };

        }
    }


    /*
      HIGHER UNEMPLOYMENT = SUPPORT FOR GOLD
    */

    if(category === "unemployment"){

        if(higher){

            return {
                direction:"up",
                title:"ОЧАКВАМЕ: ЗЛАТОТО НАГОРЕ",
                reason:
                    `Forecast (${formatValue(event,forecast)}) е по-висок от Previous (${formatValue(event,previous)}). По-слабият трудов пазар обикновено подкрепя златото.`
            };

        }
        else{

            return {
                direction:"down",
                title:"ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ",
                reason:
                    `Forecast (${formatValue(event,forecast)}) е по-нисък от Previous (${formatValue(event,previous)}). По-силният трудов пазар обикновено оказва натиск върху златото.`
            };

        }
    }


    /*
      HIGHER EXPECTED RATE = PRESSURE ON GOLD
    */

    if(category === "rates"){

        if(higher){

            return {
                direction:"down",
                title:"ОЧАКВАМЕ: ЗЛАТОТО НАДОЛУ",
                reason:
                    `Очакваната лихва е по-висока от предишната. Това означава по-строга политика и очакван натиск върху златото.`
            };

        }
        else{

            return {
                direction:"up",
                title:"ОЧАКВАМЕ: ЗЛАТОТО НАГОРЕ",
                reason:
                    `Очакваната лихва е по-ниска от предишната. Това означава по-мека политика и очаквана подкрепа за златото.`
            };

        }
    }


    /*
      OTHER NEWS
    */

    return {
        direction:"neutral",
        title:"БЕЗ ЯСНА ПОСОКА",
        reason:
            "Тази новина не е от категория, за която приложението има надеждно предварително правило за посоката на златото."
    };
}


function formatValue(event,value){

    if(value === null) return "—";

    let result = Number(value).toLocaleString("en-US",{
        maximumFractionDigits:4
    });

    if(event.unit){
        result += event.unit;
    }

    return result;
}


/* =========================================================
   NEXT NEWS
   ========================================================= */

function renderNextNews(events){

    const container =
        document.getElementById("nextNews");

    if(events.length === 0){

        container.innerHTML =
            `<div class="empty">
                Няма предстоящи новини.
             </div>`;

        return;
    }

    const e = events[0];

    const impact = getNewsImpact(e);

    container.innerHTML = `

        <div class="news-main">

            <div class="news-name">
                ${escapeHtml(e.name)}
            </div>

            <div class="news-meta">
                🇺🇸 ${escapeHtml(e.currency)}
                · ${formatDate(e.time)}
            </div>

            <div class="countdown">
                ${countdown(e.time)}
            </div>

            <div class="grid">

                <div class="stat">
                    <span>FORECAST</span>
                    <strong>
                        ${formatValue(e,e.forecast)}
                    </strong>
                </div>

                <div class="stat">
                    <span>PREVIOUS</span>
                    <strong>
                        ${formatValue(e,e.previous)}
                    </strong>
                </div>

            </div>

            <div class="impact ${impact.direction}">

                <div class="impact-title">
                    ОЧАКВАНО ВЛИЯНИЕ ВЪРХУ XAUUSD
                </div>

                <div class="impact-direction">
                    ${impact.title}
                </div>

                <div class="reason">
                    ${impact.reason}
                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   NEWS LIST
   ========================================================= */

function renderNewsList(events){

    const container =
        document.getElementById("newsList");

    if(events.length === 0){

        container.innerHTML =
            `<div class="empty">
                Няма предстоящи събития.
             </div>`;

        return;
    }

    container.innerHTML =
        events.slice(0,15).map(e => {

            const impact =
                getNewsImpact(e);

            return `

                <div class="news-item">

                    <div class="news-item-top">

                        <div class="news-item-name">
                            ${escapeHtml(e.name)}
                        </div>

                        <div class="importance">
                            ${importanceText(e.importance)}
                        </div>

                    </div>

                    <div class="news-time">
                        ${formatDate(e.time)}
                        · ${countdown(e.time)}
                    </div>

                    <div class="grid" style="margin-top:10px">

                        <div class="stat">
                            <span>FORECAST</span>
                            <strong>
                                ${formatValue(e,e.forecast)}
                            </strong>
                        </div>

                        <div class="stat">
                            <span>PREVIOUS</span>
                            <strong>
                                ${formatValue(e,e.previous)}
                            </strong>
                        </div>

                    </div>

                    <div class="news-impact ${impact.direction}">
                        ${impact.title}
                    </div>

                    <div class="news-reason">
                        ${impact.reason}
                    </div>

                </div>

            `;

        }).join("");
}


/* =========================================================
   IMPORTANCE
   ========================================================= */

function importanceText(value){

    const v = String(value).toLowerCase();

    if(
        v.includes("high") ||
        v === "3" ||
        v === "high"
    ){
        return "ВИСОКА";
    }

    if(
        v.includes("medium") ||
        v === "2"
    ){
        return "СРЕДНА";
    }

    return "НИСКА";
}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   COUNTDOWN REFRESH
   ========================================================= */

function refreshCountdowns(){

    loadNews();
}


/* =========================================================
   START
   ========================================================= */

async function start(){

    await loadPrice();

    await technicalAnalysis();

    await loadNews();
}


/* =========================================================
   AUTO UPDATE
   ========================================================= */

/*
   Price: every 15 seconds
*/
setInterval(loadPrice,15000);


/*
   Technical analysis: every 60 seconds
*/
setInterval(technicalAnalysis,60000);


/*
   News: every 5 minutes
*/
setInterval(loadNews,300000);


/*
   Countdown / news refresh:
   every 30 seconds
*/
setInterval(refreshCountdowns,30000);


/*
   Initial load
*/
start();

</script>
